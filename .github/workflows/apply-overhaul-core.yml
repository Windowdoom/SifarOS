name: Apply 2.0 Overhaul Core

on:
  push:
    branches:
      - sifar/2.0-overhaul

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout overhaul branch
        uses: actions/checkout@v4
        with:
          ref: sifar/2.0-overhaul
          fetch-depth: 0

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib nasm qemu-system-x86 python3

      - name: Apply adaptive ABI and browser redirect patches
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('kernel/syscall.c')
          text = p.read_text()
          needle = '#include <arch/x86.h>\n#include <kernel/blockdev.h>'
          if needle not in text:
              raise SystemExit('syscall include anchor missing')
          text = text.replace(needle,
                              '#include <arch/x86.h>\n#include <kernel/adaptive.h>\n#include <kernel/blockdev.h>',
                              1)

          needle = '  uint64_t disk_total = 0, disk_free = 0;\n  char vendor[16], brand[52];'
          if needle not in text:
              raise SystemExit('sysinfo locals anchor missing')
          text = text.replace(needle,
                              '  uint64_t disk_total = 0, disk_free = 0;\n  struct adaptive_snapshot adaptive;\n  char vendor[16], brand[52];',
                              1)

          needle = '  sfs_stats(&disk_total, &disk_free, NULL);\n  cpu_identify(vendor, brand);'
          if needle not in text:
              raise SystemExit('sysinfo sampling anchor missing')
          text = text.replace(needle,
                              '  sfs_stats(&disk_total, &disk_free, NULL);\n  adaptive_get_snapshot(&adaptive);\n  cpu_identify(vendor, brand);',
                              1)

          needle = '  out->disk_total_kb = (uint32_t)(disk_total / KB);\n  out->disk_free_kb = (uint32_t)(disk_free / KB);'
          if needle not in text:
              raise SystemExit('sysinfo output anchor missing')
          text = text.replace(needle, '''  out->disk_total_kb = (uint32_t)(disk_total / KB);
  out->disk_free_kb = (uint32_t)(disk_free / KB);
  out->adaptive_generation = adaptive.generation;
  out->adaptive_mode = adaptive.mode;
  out->adaptive_runnable_threads = adaptive.runnable_threads;
  out->adaptive_free_memory_percent = adaptive.free_memory_percent;
  out->adaptive_threat_score = adaptive.threat_score;
  out->adaptive_quantum_ticks = adaptive.scheduler_quantum_ticks;
  out->adaptive_background_ms = adaptive.background_interval_ms;
  out->adaptive_network_limit_bytes = adaptive.network_limit_bytes;''', 1)
          p.write_text(text)

          p = Path('user/apps/browser.c')
          text = p.read_text()
          start = text.find('static void load_page(void) {')
          end = text.find('\nstatic int document_lines(', start)
          if start < 0 or end < 0:
              raise SystemExit('browser load_page markers missing')
          replacement = r'''static void load_page(void) {
  char host[NET_HOST_MAX];
  char path[NET_PATH_MAX];
  char http_status[96];
  char next_url[URL_CAP];
  uint16_t port;
  int parsed;
  int n;
  int code;
  const char *body;
  size_t body_len;

  redirect_text[0] = '\0';

  /* Follow a bounded chain of plain-HTTP redirects. HTTPS is deliberately
   * never downgraded: the browser stops at the trust boundary until a vetted
   * TLS implementation is integrated. */
  for (int redirects = 0; redirects <= 5; redirects++) {
    parsed = parse_url(url, host, sizeof(host), &port, path, sizeof(path));
    if (parsed == -2) {
      strlcpy(security_text, "TLS required", sizeof(security_text));
      set_status("HTTPS requires the Sifar TLS service");
      document_message("Secure connection required",
                       "Sifar Web will never downgrade an HTTPS address to HTTP.");
      return;
    }
    if (parsed < 0) {
      strlcpy(security_text, "Invalid URL", sizeof(security_text));
      set_status("Use http://host/path or host/path");
      document_message("Address not understood", url);
      return;
    }

    strlcpy(security_text, "HTTP", sizeof(security_text));
    set_status(redirects ? "Following redirect..." : "Loading...");
    n = http_get(host, port, path, response, RESPONSE_CAP);
    if (n < 0) {
      if (n == -10)
        set_status("Network paused by Sifar Adaptive Core defensive mode");
      else if (n == -2)
        set_status("Network service is busy. Try again");
      else
        set_status("Request failed. Check the network and HTTP address");
      document_message("Could not load this page", status_text);
      return;
    }

    if ((size_t)n >= RESPONSE_CAP)
      n = RESPONSE_CAP - 1;
    response[n] = '\0';
    body = find_body(response, n, http_status, sizeof(http_status));
    body_len = (size_t)n - (size_t)(body - response);
    code = response_code(http_status);

    if (code >= 300 && code < 400 &&
        find_header(response, n, "Location", redirect_text,
                    sizeof(redirect_text))) {
      if (starts_ci(redirect_text, "https://")) {
        strlcpy(url, redirect_text, sizeof(url));
        strlcpy(security_text, "TLS required", sizeof(security_text));
        snprintf(status_text, sizeof(status_text), "%d redirect to HTTPS", code);
        document_message("Secure web hand-off required", redirect_text);
        return;
      }

      if (starts_ci(redirect_text, "http://")) {
        strlcpy(next_url, redirect_text, sizeof(next_url));
      } else if (redirect_text[0] == '/') {
        if (port == 80)
          snprintf(next_url, sizeof(next_url), "http://%s%s", host, redirect_text);
        else
          snprintf(next_url, sizeof(next_url), "http://%s:%u%s", host,
                   (unsigned)port, redirect_text);
      } else {
        snprintf(status_text, sizeof(status_text), "%s | unsupported redirect",
                 http_status);
        document_message("Redirect target not understood", redirect_text);
        return;
      }

      strlcpy(url, next_url, sizeof(url));
      continue;
    }

    html_to_text(body, body_len);
    scroll_line = 0;
    snprintf(status_text, sizeof(status_text), "%s | %d bytes", http_status, n);
    return;
  }

  set_status("Too many redirects");
  document_message("Navigation stopped", "The site redirected more than five times.");
}
'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text)
          PY

      - name: Strict build
        run: make clean && make

      - name: Serial boot regression
        run: make test

      - name: GUI regression
        run: make test-gui

      - name: Commit verified core overhaul
        run: |
          git config user.name 'SifarOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add kernel/syscall.c user/apps/browser.c
          git commit -m 'adaptive: expose policy state and follow HTTP redirects'
          git push origin HEAD:sifar/2.0-overhaul
