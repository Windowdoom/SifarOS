name: Wire staged network ABI

on:
  push:
    branches:
      - sifar/2.0-adaptive-staging

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: sifar/2.0-adaptive-staging
          fetch-depth: 0

      - name: Apply network integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          def insert_before(path, marker, addition):
              p = Path(path)
              text = p.read_text()
              if addition.strip() in text:
                  return
              if marker not in text:
                  raise SystemExit(f"marker missing in {path}: {marker!r}")
              p.write_text(text.replace(marker, addition + marker, 1))

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"old text missing in {path}")
              p.write_text(text.replace(old, new, 1))

          insert_before("kernel/main.c", "#include <kernel/rtl8139.h>\n",
                        "#include <kernel/net.h>\n")
          replace_once(
              "kernel/main.c",
              '''    if (rtl8139_init() == 0) {
                  const uint8_t *mac = rtl8139_mac();
                  kprintf("net    : RTL8139 %02x:%02x:%02x:%02x:%02x:%02x ready (polling)\\n",
                          mac[0], mac[1], mac[2], mac[3], mac[4], mac[5]);
              } else {
                  kprintf("net    : no RTL8139 device\\n");
              }
          ''',
              '''    if (rtl8139_init() == 0) {
                  const uint8_t *mac = rtl8139_mac();
                  struct net_info net;

                  kprintf("net    : RTL8139 %02x:%02x:%02x:%02x:%02x:%02x ready (polling)\\n",
                          mac[0], mac[1], mac[2], mac[3], mac[4], mac[5]);
                  if (net_init() == 0) {
                      net_get_info(&net);
                      kprintf("stack  : IPv4 %u.%u.%u.%u gateway %u.%u.%u.%u dns %u.%u.%u.%u\\n",
                              net.ipv4[0], net.ipv4[1], net.ipv4[2], net.ipv4[3],
                              net.gateway[0], net.gateway[1], net.gateway[2], net.gateway[3],
                              net.dns[0], net.dns[1], net.dns[2], net.dns[3]);
                  }
              } else {
                  kprintf("net    : no RTL8139 device\\n");
              }
          ''')

          insert_before("kernel/net/net.c", "#include <kernel/net.h>\n",
                        "#include <kernel/adaptive.h>\n")
          replace_once(
              "kernel/net/net.c",
              '''    if (!net_ready() || !host || !*host || !path || !out || capacity == 0 ||
                  capacity > NET_HTTP_MAX || port == 0)
                  return -1;

              flags = irq_save();
          ''',
              '''    if (!net_ready() || !host || !*host || !path || !out || capacity == 0 ||
                  capacity > NET_HTTP_MAX || port == 0)
                  return -1;
              if (!adaptive_network_allowed())
                  return -10;
              capacity = adaptive_network_limit(capacity);
              if (capacity == 0)
                  return -10;

              flags = irq_save();
          ''')

          insert_before("kernel/syscall.c", "#include <kernel/proc.h>\n",
                        "#include <kernel/net.h>\n")
          insert_before(
              "kernel/syscall.c",
              "static void syscall_handler(struct registers *regs) {\n",
              '''static int32_t sys_net_info(uint32_t p) {
            struct net_info *out = USER_STRUCT(p, struct net_info);

            if (!proc_has_cap(proc_current(), PROC_CAP_NETWORK)) {
              denied(SYS_NET_INFO);
              return -1;
            }
            if (!out)
              return -1;
            net_get_info(out);
            return 0;
          }

          static int32_t sys_http_get(uint32_t req_ptr, uint32_t out_ptr,
                                      uint32_t capacity) {
            struct net_http_request request;
            const struct net_http_request *user_request =
                (const struct net_http_request *)(uintptr_t)req_ptr;
            void *out = (void *)(uintptr_t)out_ptr;

            if (!proc_has_cap(proc_current(), PROC_CAP_NETWORK)) {
              denied(SYS_HTTP_GET);
              return -1;
            }
            if (capacity == 0 || capacity > NET_HTTP_MAX ||
                !proc_user_range_ok(user_request, sizeof(request)) ||
                !proc_user_write_ok(out, capacity))
              return -1;

            memcpy(&request, user_request, sizeof(request));
            request.host[NET_HOST_MAX - 1] = '\\0';
            request.path[NET_PATH_MAX - 1] = '\\0';
            if (!request.host[0] || !request.path[0] || request.port == 0)
              return -1;

            return net_http_get(request.host, request.port, request.path,
                                out, capacity);
          }

          ''')
          insert_before(
              "kernel/syscall.c",
              "  default:\n",
              '''  case SYS_NET_INFO:
            result = sys_net_info(arg1);
            break;
          case SYS_HTTP_GET:
            result = sys_http_get(arg1, arg2, arg3);
            break;
          ''')

          insert_before(
              "user/lib/sifar.c",
              "/* ----------------------------------------------------------------- heap */\n",
              '''/* --------------------------------------------------------------- network */

          int network_info(struct net_info *out)
          {
              return syscall3(SYS_NET_INFO, (int)out, 0, 0);
          }

          int http_get(const char *host, uint16_t port, const char *path,
                       void *out, size_t capacity)
          {
              struct net_http_request request;

              if (!host || !path || !out || !port || capacity == 0 ||
                  capacity > NET_HTTP_MAX)
                  return -1;
              memset(&request, 0, sizeof(request));
              if (strlcpy(request.host, host, sizeof(request.host)) >= sizeof(request.host) ||
                  strlcpy(request.path, path, sizeof(request.path)) >= sizeof(request.path))
                  return -1;
              request.port = port;
              return syscall3(SYS_HTTP_GET, (int)&request, (int)out, (int)capacity);
          }

          ''')

          replace_once(
              "kernel/proc.c",
              '''int proc_spawn(const char *path, int argc, const char *const *argv)
          {
              struct fs_node *node = vfs_lookup(proc_current()->cwd, path);
              uint8_t *image;
              ssize_t read;
              int result;
              const char *name;
              if (!node || node->type != FS_FILE)
                  return -1;
              image = (uint8_t *)kmalloc(node->size);
              if (!image)
                  return -2;
              read = vfs_read(node, 0, image, node->size);
              if (read <= 0) {
                  kfree(image);
                  return -3;
              }
              name = strrchr(path, '/');
              name = name ? name + 1 : path;
              result = proc_spawn_image(name, image, (size_t)read, argc, argv);
              kfree(image);
              return result;
          }
          ''',
              '''int proc_spawn(const char *path, int argc, const char *const *argv)
          {
              struct process *caller = proc_current();
              struct fs_node *node = vfs_lookup(caller->cwd, path);
              char absolute[FS_PATH_MAX];
              uint8_t *image;
              ssize_t read;
              int result;
              const char *name;

              if (!node || node->type != FS_FILE)
                  return -1;
              if (vfs_abspath(caller->cwd, path, absolute, sizeof(absolute)) < 0)
                  return -1;
              image = (uint8_t *)kmalloc(node->size);
              if (!image)
                  return -2;
              read = vfs_read(node, 0, image, node->size);
              if (read <= 0) {
                  kfree(image);
                  return -3;
              }
              name = strrchr(absolute, '/');
              name = name ? name + 1 : absolute;
              result = proc_spawn_image(name, image, (size_t)read, argc, argv);
              kfree(image);

              /* Network authority belongs only to the immutable packaged
               * browser at its canonical path. Capabilities are never inherited. */
              if (result > 0 && node->readonly && strcmp(absolute, "/apps/browser") == 0)
                  proc_grant_caps(result, PROC_CAP_NETWORK);
              return result;
          }
          ''')

          # Give the browser a first-class launcher label without changing the
          # desktop's capability model.
          replace_once(
              "user/apps/desktop.c",
              '''static const struct known known_apps[] = {
              { "terminal", "Terminal",  ICON_TERMINAL },
          ''',
              '''static const struct known known_apps[] = {
              { "terminal", "Terminal",  ICON_TERMINAL },
              { "browser",  "Sifar Browser", ICON_TEXT },
          ''')
          PY

          clang-format -i kernel/main.c kernel/net/net.c kernel/syscall.c \
                           kernel/proc.c user/lib/sifar.c user/apps/desktop.c
          git diff --check

      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo "Network wiring already present."
            exit 0
          fi
          git config user.name "SifarOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add kernel/main.c kernel/net/net.c kernel/syscall.c kernel/proc.c \
                  user/lib/sifar.c user/apps/desktop.c
          git commit -m "net: wire capability-gated browser service"
          git push origin HEAD:sifar/2.0-adaptive-staging
