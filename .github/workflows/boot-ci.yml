name: Boot CI

on:
  push:
    branches:
      - main
      - sifar/hardening-v1
      - sifar/2.0-dev
  pull_request:

jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib nasm qemu-system-x86 python3

      - name: Build SifarOS image
        run: make clean && make WERROR=0

      - name: Run serial boot test suite
        run: make test

      - name: Rebuild clean image for high-memory regression
        run: make clean && make WERROR=0

      - name: Run boot suite with 2 GiB guest RAM
        env:
          MEMORY: 2048
          LOG: build/test-output-2g.log
          LOG2: build/test-reboot-2g.log
        run: make test
