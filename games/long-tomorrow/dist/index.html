  },

  /* ── Sky: sun path, planets and moons in the sky ── */
  setSun(t){
    const site=this.site;const sky=site.sky;let el=sky.sunEl,az=.6;
    if(site.day>0){const ph=(G.state.dayPhase||0)*Math.PI*2;el=Math.sin(ph)*.85+.1;az=ph*.9;}
    this.sunDir.set(Math.cos(az)*Math.cos(el),Math.sin(el),Math.sin(az)*Math.cos(el)).normalize();
    if(site.terrain&&site.terrain.terminator)this.sunDir.set(-1,sky.sunEl,.15).normalize();
    const day=U.smooth(-.12,.18,this.sunDir.y);
    const u=this.skyMesh.material.uniforms;u.sunDir.value.copy(this.sunDir);u.day.value=Math.max(day,sky.stars>=1?1:.04);u.time.value=G.time;
    this.sun.intensity=(sky.sunSize>2?2.1:2.8)*Math.max(.02,day)*(this.flare>0?1+this.flare*2:1);
    this.hemi.intensity=(sky.stars>=1?.14:.55)*(.12+.88*day);
    this.day=day;
  },
  addSkyBodies(site){
    const add=(dir,size,col,{rings=false,faint=1,bands=false}={})=>{
      const d=new THREE.Vector3(...dir).normalize();const R=2400;const rad=Math.tan(size/2)*R*2;
      const m=Gen.planetMaterial({type:bands?'gas':'rocky',pal:[col,col==='#c8b8a0'?'#8a7a60':'#6a6a70','#efe1c4'],atmo:null},U.hash(col));
      const mesh=new THREE.Mesh(new THREE.SphereGeometry(rad,48,32),m);mesh.position.copy(d).multiplyScalar(R);mesh.renderOrder=-5;
      m.uniforms.sunDir.value.copy(this.sunDir);if(faint<1){m.transparent=true;m.opacity=faint;}
      mesh.material.depthWrite=false;this.scene.add(mesh);this.skyBodies=(this.skyBodies||[]);this.skyBodies.push({mesh,d});
      if(rings){const r=Gen.rings(rad,'#d8c89a');r.position.copy(mesh.position);r.renderOrder=-4;r.material.depthWrite=false;this.scene.add(r);this.skyBodies.push({mesh:r,d});}
    };
    for(const b of site.skyBodies||[]){
      if(b.kind==='earth'){const m=Gen.planetMaterial({type:'earth',pal:['#2a5d9a','#3d7a3e'],atmo:'#7fb8ff'},3);const R=2400,rad=Math.tan(b.size/2)*R*2;const mesh=new THREE.Mesh(new THREE.SphereGeometry(rad,48,32),m);mesh.position.set(...b.dir).normalize().multiplyScalar(R);mesh.renderOrder=-5;m.uniforms.sunDir.value.copy(this.sunDir);this.scene.add(mesh);}
      else if(b.kind==='jupiter')add(b.dir,b.size,'#d9b48a',{bands:true});
      else if(b.kind==='saturn')add(b.dir,b.size,'#e3cf9c',{bands:true,rings:true,faint:b.faint||1});
      else add(b.dir,b.size,b.col||'#aaa');
    }
    if(site.companions){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:Gen.glowTex(),color:C('#fff4e0'),blending:THREE.AdditiveBlending,depthWrite:false}));s.material.color.multiplyScalar(3);s.position.set(.8,.3,-.5).normalize().multiplyScalar(2400);s.scale.setScalar(70);this.scene.add(s);}
    if(site.sky.blackhole){const bh=Gen.star(260,'#000',{blackhole:true});bh.position.set(-.3,.55,-.78).normalize().multiplyScalar(2200);bh.lookAt(0,0,0);bh.rotateX(.4);this.scene.add(bh);this.bh=bh;}
    if(site.sky.galaxy){const s=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:Gen.galaxyTex(4,9),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
      s.position.set(.3,.5,-.8).normalize().multiplyScalar(2300);s.lookAt(0,0,0);s.rotateX(1.1);s.scale.setScalar(1500);s.material.color.setScalar(1.8);this.scene.add(s);}
  },

  /* ── Points of interest: deterministic per site ── */
  layoutPOIs(site,siteId){
    const r=U.rng(U.hash(siteId+'poi'));const P={};
    const near=['shop','bar','clinic','hall','yard','fab','office','union','kiosk','lab','array','range','archive','rig','depot','heart','garage','memorial'];
    near.forEach((k,i)=>{const a=i/near.length*Math.PI*2+.2;const rad=34+(i%3)*9;P[k]=[Math.cos(a)*rad,Math.sin(a)*rad];});
    P.plaza=[0,0];P.pad=[-72,52];P.custodian=[0,-60];P.core=[0,-30];
    const far=(k,ang,rad)=>{P[k]=[Math.cos(ang)*rad,Math.sin(ang)*rad];};
    far('dest',.3,300);far('keel',0,330);far('drillsite',2.4,300);far('vein',1.1,200);far('rings',-2.2,150);far('quarry',-.7,190);far('icefield',2.9,190);far('crack',1.8,220);far('faculae',-1.5,160);
    for(let i=1;i<=3;i++){far('dish'+i,i*2.1+.4,130+i*18);far('tower'+i,i*2.09+1,95+i*25);far('shard'+i,i*2.1-.6,150+i*28);far('pylon'+i,i*2.094,70);far('strand'+i,.9+i*.55,120+i*22);far('poi'+i,r()*6.28,170+r()*260);}
    far('camp',r()*6.28,220+r()*140);
    if(site.style==='city'){P.garage=[-40,-110];P.dest=[260,150];}
    if(site.style==='shore'){P.rings=[40,-230];}
    return P;
  },

  /* ── Height field ── */
  makeHeight(site){
    const T=site.terrain;const N=makeNoise(this.seed);const r=U.rng(this.seed+7);
    if(T.plate){const edge=this.interior?999:390;return(x,z)=>{const d=Math.hypot(x,z);if(d>edge)return -600;return 0;};}
    const craters=[];for(let i=0;i<(T.craters||0);i++){const a=r()*6.28,d=150+r()*420;craters.push({x:Math.cos(a)*d,z:Math.sin(a)*d,r:10+Math.pow(r(),2)*70,dep:.35});}
    const flats=[{x:0,z:0,r:T.flat,h:0}];
    for(const k of['keel','drillsite','dest','camp','poi1','poi2','poi3','tower1','tower2','tower3','rings','vein','dish1','dish2','dish3']){if(this.pois[k]){flats.push({x:this.pois[k][0],z:this.pois[k][1],r:14,h:null});}}
    const base=(x,z)=>{let n=fbm2(N,x*T.scale,z*T.scale,T.oct||5);if(T.ridge)n=U.lerp(n,ridge2(N,x*T.scale*.6+91,z*T.scale*.6-37,5)*1.5-.55,T.ridge);
      let h=n*T.amp;const d=Math.hypot(x,z);h+=U.smooth(300,560,d)*T.amp*.9;
      for(const c of craters){const dd=Math.hypot(x-c.x,z-c.z)/c.r;if(dd<1.6){h+=dd<1?c.r*c.dep*(dd*dd-1)*.6:c.r*c.dep*.25*Math.pow((1.6-dd)/.6,2)*(dd<1.2?(dd-1)/.2:1);}}
      return h;};
    for(const f of flats)if(f.h===null)f.h=base(f.x,f.z);
    return(x,z)=>{let h=base(x,z);for(const f of flats){const d=Math.hypot(x-f.x,z-f.z);if(d<f.r*1.8+12){h=U.lerp(f.h,h,U.smooth(f.r,f.r*1.8+12,d));}}return h;};
  },
  normalAt(x,z){const e=1.2;const hx=this.h(x+e,z)-this.h(x-e,z),hz=this.h(x,z+e)-this.h(x,z-e);return new THREE.Vector3(-hx,2*e,-hz).normalize();},
  buildTerrain(site){
    const q=G.settings.quality;const seg=q==='low'?120:q==='medium'?170:q==='ultra'?260:210;
    const geo=new THREE.PlaneGeometry(this.size,this.size,seg,seg);geo.rotateX(-Math.PI/2);
    const pos=geo.attributes.position;const cols=new Float32Array(pos.count*3);const N=makeNoise(this.seed+3);
    const g0=C(site.ground[0]),g1=C(site.ground[1]),g2=C(site.ground[2]),g3=C(site.ground[3]);const tmp=new THREE.Color();
    const T=site.terrain;const sea=site.sea?site.sea.level:-999;
    for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);const y=this.h(x,z);pos.setY(i,y);
      const n=this.normalAt(x,z);const slope=1-n.y;const nz=fbm2(N,x*.02,z*.02,3)*.5+.5;const hn=U.clamp((y+T.amp*.3)/(T.amp*1.6+1),0,1);
      tmp.copy(g0).lerp(g1,U.smooth(.2,.7,nz*.6+hn*.6));
      if(hn>.72)tmp.lerp(g2,U.smooth(.72,.95,hn));
      tmp.lerp(g3,U.smooth(.18,.45,slope));
      if(y<sea+1.2)tmp.lerp(g2,.35*(1-U.smooth(sea,sea+1.2,y)));
      if(T.terminator)tmp.lerp(g2,U.smooth(40,260,x+fbm2(N,x*.01,z*.01,3)*60));
      if(T.faculae){const d=Math.hypot(x-this.pois.faculae[0],z-this.pois.faculae[1]);tmp.lerp(g2,1-U.smooth(10,60,d+fbm2(N,x*.05,z*.05,3)*25));}
      if(T.cracks){const c=Math.abs(N.n2(x*.012,z*.012));if(c<.05)tmp.lerp(C('#8a4a2a'),.7*(1-c/.05));}
      const v=.9+fbm2(N,x*.15,z*.15,2)*.12;cols[i*3]=tmp.r*v;cols[i*3+1]=tmp.g*v;cols[i*3+2]=tmp.b*v;}
    geo.setAttribute('color',new THREE.BufferAttribute(cols,3));geo.computeVertexNormals();
    const mat=Gen.terrainMaterial();const mesh=new THREE.Mesh(geo,mat);mesh.receiveShadow=true;this.scene.add(mesh);this.terrain=mesh;
    // skirt out to the horizon
    const sg=new THREE.PlaneGeometry(9000,9000,90,90);sg.rotateX(-Math.PI/2);const sp=sg.attributes.position;const sc=new Float32Array(sp.count*3);
    for(let i=0;i<sp.count;i++){const x=sp.getX(i),z=sp.getZ(i);const inside=Math.abs(x)<this.size/2-10&&Math.abs(z)<this.size/2-10;let y=this.h(x,z)+(inside?-12:0);
      if(!inside)y+=U.smooth(this.size*.5,4000,Math.hypot(x,z))*T.amp*2.2*(fbm2(N,x*.0008,z*.0008,3)*.5+.7);sp.setY(i,y);tmp.copy(g1).lerp(g3,.3);sc.set([tmp.r,tmp.g,tmp.b],i*3);}
    sg.setAttribute('color',new THREE.BufferAttribute(sc,3));sg.computeVertexNormals();this.scene.add(new THREE.Mesh(sg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1})));
  },
  buildSea(site){
    const m=Gen.liquidMaterial(site.sea.color,{lava:site.sea.lava,glow:site.sea.glow});
    const w=new THREE.Mesh(new THREE.PlaneGeometry(9000,9000,1,1),m);w.rotation.x=-Math.PI/2;w.position.y=site.sea.level;this.scene.add(w);this.sea=w;
    m.uniforms.fogColor.value.copy(C(site.sky.fog));m.uniforms.fogDensity.value=site.sky.fogD;m.uniforms.skyCol.value.copy(C(site.sky.hor));m.uniforms.sunCol.value.copy(C(site.sky.sunCol));
  },

  /* ── Colliders ── */
  addBox(x,y,z,w,h,d,mat,{collide=true,shadow=true,uvScale=8,rotY=0}={}){
    const geo=new THREE.BoxGeometry(w,h,d);
    const uv=geo.attributes.uv;for(let i=0;i<uv.count;i++){const f=Math.floor(i/4);const sx=f<2?d:w,sy=f===2||f===3?d:h;uv.setXY(i,uv.getX(i)*sx/uvScale,uv.getY(i)*sy/uvScale);}
    const m=new THREE.Mesh(geo,mat);m.position.set(x,y+h/2,z);m.rotation.y=rotY;m.castShadow=shadow;m.receiveShadow=true;this.scene.add(m);
    if(collide){const c=Math.abs(Math.cos(rotY)),s=Math.abs(Math.sin(rotY));const hw=(w*c+d*s)/2,hd=(w*s+d*c)/2;this.addCollider(x-hw,y,z-hd,x+hw,y+h,z+hd);}
    return m;
  },
  addCollider(x0,y0,z0,x1,y1,z1){const c={x0,y0,z0,x1,y1,z1};this.colliders.push(c);const cs=16;
    for(let i=Math.floor(x0/cs);i<=Math.floor(x1/cs);i++)for(let k=Math.floor(z0/cs);k<=Math.floor(z1/cs);k++){const key=i+','+k;let l=this.grid.get(key);if(!l)this.grid.set(key,l=[]);l.push(c);}return c;},
  near(x,z,r=2){const cs=16;const out=new Set();for(let i=Math.floor((x-r)/cs);i<=Math.floor((x+r)/cs);i++)for(let k=Math.floor((z-r)/cs);k<=Math.floor((z+r)/cs);k++){const l=this.grid.get(i+','+k);if(l)for(const c of l)out.add(c);}return out;},
  groundAt(x,z,fromY,rad=.3){let g=this.h(x,z);for(const c of this.near(x,z,rad)){if(x>c.x0-rad&&x<c.x1+rad&&z>c.z0-rad&&z<c.z1+rad&&c.y1<=fromY+.5&&c.y1>g)g=c.y1;}return g;},
  rayBox(o,d,c,maxT){let tmin=0,tmax=maxT;for(const [a,lo,hi] of[['x',c.x0,c.x1],['y',c.y0,c.y1],['z',c.z0,c.z1]]){const oa=o[a],da=d[a];if(Math.abs(da)<1e-8){if(oa<lo||oa>hi)return -1;}else{let t1=(lo-oa)/da,t2=(hi-oa)/da;if(t1>t2)[t1,t2]=[t2,t1];tmin=Math.max(tmin,t1);tmax=Math.min(tmax,t2);if(tmin>tmax)return -1;}}return tmin;},
  raycastStatic(o,d,maxT){
    let best=maxT;const seen=new Set();
    for(let t=0;t<=maxT;t+=8){const px=o.x+d.x*t,pz=o.z+d.z*t;for(const c of this.near(px,pz,9)){if(seen.has(c))continue;seen.add(c);const h=this.rayBox(o,d,c,best);if(h>=0&&h<best)best=h;}}
    // terrain march
    let prev=0;for(let t=.5;t<best;t+=Math.max(.5,t*.02)){const y=o.y+d.y*t;if(y<this.h(o.x+d.x*t,o.z+d.z*t)){let a=prev,b=t;for(let i=0;i<8;i++){const m=(a+b)/2;if(o.y+d.y*m<this.h(o.x+d.x*m,o.z+d.z*m))b=m;else a=m;}best=b;break;}prev=t;}
    return best;
  },
  los(a,b){const d=new THREE.Vector3().subVectors(b,a);const L=d.length();d.divideScalar(L);return this.raycastStatic(a,d,L)>=L-.5;},

  /* ── Settlements ── */
  buildSettlement(site){
    const st=site.style;const r=this.r;const P=this.pois;

  updateVehicle(v,dt,driven){

      const c=Math.cos(v.yaw),sn=Math.sin(v.yaw);const sample=(fx,sx)=>S.groundAt(v.pos.x+sn*fx+c*sx,v.pos.z+c*fx-sn*sx,v.pos.y+1.2,.2);

  /* ── Camera ── */
  updateCamera(dt){

    if(!G.paused){c.yaw-=Input.mdx*sens;c.pitch-=Input.mdy*sens*(G.settings.invertY?-1:1);c.pitch=U.clamp(c.pitch,-1.35,1.25);c.dist=U.clamp(c.dist+Input.wheel*.6,1.6,P.vehicle?16:9);}

    const v=P.vehicle;
    let target;
    if(v){target=v.pos.clone().add(new THREE.Vector3(0,2.2,0));const dist=Math.max(c.dist,8)+(v.kind==='hover'?2:0);
      if(Input.mdx===0&&Input.mdy===0&&Math.abs(v.speed)>3){c.yaw=c.yaw+U.angDiff(c.yaw,v.yaw+Math.PI)*Math.min(1,dt*2.5);}
      const off=new THREE.Vector3(Math.sin(c.yaw)*Math.cos(c.pitch),-Math.sin(c.pitch)+.25,Math.cos(c.yaw)*Math.cos(c.pitch)).multiplyScalar(dist);
      cam.position.copy(target).add(off);}
    else if(c.fp){target=P.pos.clone().add(new THREE.Vector3(0,1.62,0));cam.position.copy(target);}
    else{
      target=P.pos.clone().add(new THREE.Vector3(0,1.55,0));const aim=Input.mb[2];const dist=aim?1.9:c.dist;
      const back=new THREE.Vector3(Math.sin(c.yaw)*Math.cos(c.pitch),-Math.sin(c.pitch),Math.cos(c.yaw)*Math.cos(c.pitch));
      const right=new THREE.Vector3(Math.cos(c.yaw),0,-Math.sin(c.yaw));target.addScaledVector(right,aim?.55:.35);
      // camera collision
      const d=S.interior?Math.min(dist,this.interiorCamLimit(target,back,dist)):Math.min(dist,S.raycastStatic(target,back,dist)-.25);
      cam.position.copy(target).addScaledVector(back,Math.max(.4,d));
    }
    const gy=S.h(cam.position.x,cam.position.z)+.35;if(!S.interior&&cam.position.y<gy)cam.position.y=gy;
    const look=new THREE.Vector3(-Math.sin(c.yaw)*Math.cos(c.pitch),Math.sin(c.pitch),-Math.cos(c.yaw)*Math.cos(c.pitch));
    cam.lookAt(cam.position.clone().add(look));cam.rotateX(c.kick);
    if(c.shake>.001){cam.rotation.z+=(Math.random()-.5)*c.shake*.05;cam.position.x+=(Math.random()-.5)*c.shake*.1;cam.position.y+=(Math.random()-.5)*c.shake*.1;}
    const fov=G.settings.fov*(Input.mb[2]&&WEAPONS[G.state.player.weapon]?.scope?.45:Input.mb[2]?.85:1)*(P.vehicle?1.08:1);cam.fov=U.damp(cam.fov,fov,10,dt);cam.updateProjectionMatrix();

      if(hit.left<=0){S.parts.burst(hit.pos,C(ORE_COL[hit.ore]),60,60,12,1.2);hit.mesh.visible=false;UI.toast('Asteroid depleted.');}}
  },
  shoot(from,vel,dmg,col,owner,life=3,size=6){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:Gen.sparkTex(),color:C(col),blending:THREE.AdditiveBlending,depthWrite:false}));m.material.color.multiplyScalar(4);m.scale.setScalar(size);m.position.copy(from);this.scene.add(m);const sh={mesh:m,pos:m.position,vel,dmg,owner,life,col};this.shots.push(sh);return sh;},
  updateShots(dt){
    const S=this;for(const sh of S.shots){sh.life-=dt;if(sh.homing&&!sh.homing.dead){const to=sh.homing.pos.clone().sub(sh.pos).normalize();sh.vel.lerp(to.multiplyScalar(Math.max(700,sh.vel.length()+dt*400)),1-Math.exp(-dt*3));S.parts.emit(sh.pos,new THREE.Vector3(),C('#ff9f6b'),4,.5);}
      const a0=sh.pos.clone();sh.pos.addScaledVector(sh.vel,dt);const seg=sh.pos.clone().sub(a0);const sl=seg.lengthSq();
      const near=(c)=>{const t=sl>0?U.clamp(c.clone().sub(a0).dot(seg)/sl,0,1):0;return a0.clone().addScaledVector(seg,t).distanceTo(c);};
      if(sh.owner==='player'){for(const t of S.ships){if(t.dead)continue;if(near(t.pos)<t.radius+4){this.damageShip(t,sh.dmg,'player');sh.life=0;S.parts.burst(sh.pos.clone(),C(sh.col),10,50,6,.4);break;}}}
      else if(near(S.P.pos)<S.P.radius+3){this.damagePlayer(sh.dmg);sh.life=0;S.parts.burst(sh.pos.clone(),C(sh.col),10,50,6,.4);}
      else for(const t of S.ships){if(t.dead||t===sh.owner||t.faction===sh.owner.faction)continue;if(near(t.pos)<t.radius+4){this.damageShip(t,sh.dmg,sh.owner);sh.life=0;break;}}}
    S.shots=S.shots.filter(sh=>{if(sh.life<=0){S.scene.remove(sh.mesh);return false;}return true;});
  },
  damagePlayer(d,heat){const S=this,s=G.state,P=S.P;P.lastHit=S.time;if(!heat)S.shake=Math.max(S.shake||0,Math.min(20,d*.3));
    if(P.shield>0){const a=Math.min(P.shield,d);P.shield-=a;d-=a;P.shieldMesh.material.uniforms.a.value=1;if(!heat)AudioSys.sfx('shield');}
    if(d>0){s.ship.hp-=d;Render.fx.damage=Math.min(1,Render.fx.damage+d/80);if(!heat)AudioSys.sfx('hurt');}
    if(s.ship.hp<=0)this.destroyed();},
  damageShip(t,d,by){if(t.dead)return;if(by==='player'&&!t.hostile){t.hostile=true;if(t.faction==='concord'||t.faction==='frontier'){Game.addRep(t.faction,-8);G.state.wanted=Math.min(5,(G.state.wanted||0)+1);UI.toast(`You fired on a ${FACTIONS[t.faction].short} ship.`,'bad');for(const o of this.ships)if(o.faction===t.faction&&o.role==='patrol')o.hostile=true;}if(t.faction.startsWith('civ:'))Game.addRep(t.faction,-10);}
    t.aggro=by;if(t.shield>0){const a=Math.min(t.shield,d);t.shield-=a;d-=a;}t.hull-=d;t.lastHit=this.time;if(t.hull<=0)this.killShip(t,by);},
  killShip(t,by){const S=this,s=G.state;t.dead=true;S.scene.remove(t.mesh);AudioSys.sfx('explode',Math.max(.2,1-t.pos.distanceTo(S.P.pos)/5000));
    S.parts.burst(t.pos.clone(),C('#ffb060'),120,160,18,1.6);S.parts.burst(t.pos.clone(),C('#ffffff'),30,60,30,.3);
    const fl=new THREE.PointLight(C('#ffa050'),20,4000);fl.position.copy(t.pos);S.scene.add(fl);setTimeout(()=>S.scene&&S.scene.remove(fl),300);
    if(S.target===t)S.target=null;
    if(by==='player'){s.stats.kills++;Game.addXP('piloting',t.role==='sentinel'?1400:450);Game.addXP('combat',120);
      if(t.faction==='syndicate'){Game.addRep('syndicate',-2);Game.addRep('concord',1);Game.addCredits(t.role==='sentinel'?0:250);}
      if(t.role==='sentinel'){Game.giveItem('relic',1);if(Math.random()<.6)Game.giveItem('sifarite',1+Math.floor(Math.random()*2));}
      if(t.role==='trader'&&t.faction!=='syndicate'){Game.giveItem(U.pick(Math.random,['food','machinery','electronics','meds']),2+Math.floor(Math.random()*4));Game.addRep('syndicate',2);}
      Story.event(s,'spacekill',{tag:t.tag||(t.role!=='trader'&&t.faction==='syndicate'?'bounty':'')});}},
  destroyed(){const s=G.state;if(this._dead)return;this._dead=true;AudioSys.sfx('explode');UI.fade(true,'Hull breach. Emergency pod launched.');
    setTimeout(()=>{this._dead=false;const cost=Math.min(s.credits,Math.round(HULLS[s.ship.hull].cost*.1+500));Game.addCredits(-cost);s.ship.hp=Game.shipStats().hull*.5;s.wanted=0;UI.toast(`Insurance claim: ${U.fmt(cost)} cr. Your ship was recovered and patched.`,'bad');
      const back=s.lastSafe||{system:'sol',site:'earth'};Game.goSurface(back.site,{system:back.system});UI.fade(false);},2200);},
  cycleTarget(){const S=this;const list=S.ships.filter(s=>!s.dead&&s.pos.distanceTo(S.P.pos)<12000).sort((a,b)=>(b.hostile-a.hostile)||a.pos.distanceTo(S.P.pos)-b.pos.distanceTo(S.P.pos));if(!list.length){S.target=null;return;}const i=list.indexOf(S.target);S.target=list[(i+1)%list.length];AudioSys.sfx('ui');},

  /* ── NPC ship AI ── */
  updateShips(dt){
    const S=this,P=S.P,s=G.state;
    for(const t of S.ships){if(t.dead)continue;t.t-=dt;t.cd-=dt;
      if(t.lastHit&&S.time-t.lastHit>4)t.shield=Math.min(t.maxShield,t.shield+dt*10);
      let goal=null,spd=t.speed;
      const enemy=t.hostile?P:null;const dP=t.pos.distanceTo(P.pos);
      // patrols engage hostile pirates nearby
      let foe=null;if(t.role==='patrol'){foe=S.ships.find(o=>!o.dead&&o.faction==='syndicate'&&o.pos.distanceTo(t.pos)<3000);}
      if(!foe&&t.hostile&&dP<6000&&!(s.flags.gate_throat&&false))foe='player';
      if(t.convoy&&t.aggro)t.hostile=false;
      if(foe){const fp=foe==='player'?P.pos:foe.pos;const fv=foe==='player'?P.vel:foe.vel;const d=t.pos.distanceTo(fp);
        if(d>500||t.state==='break'){goal=fp.clone().addScaledVector(fv,.8);if(t.state==='break'&&t.t<0)t.state='attack';}else{goal=t.pos.clone().add(t.vel.clone().normalize().multiplyScalar(800)).add(new THREE.Vector3((Math.random()-.5)*600,(Math.random()-.5)*600,(Math.random()-.5)*600));t.state='break';t.t=2+Math.random()*2;}
        const fwd=new THREE.Vector3(0,0,1).applyQuaternion(t.quat);const to=fp.clone().sub(t.pos).normalize();
        if(t.dps>0&&t.cd<=0&&fwd.dot(to)>.96&&d<1600){t.cd=t.role==='sentinel'?1.6:.55+Math.random()*.4;
          const from=t.pos.clone().addScaledVector(fwd,t.radius);
          if(t.role==='sentinel')this.beam(from,to,1600,t.dps*1.6,'#ffcf7e',t);else this.shoot(from,to.clone().multiplyScalar(1100).add(t.vel),t.dps*.55,t.faction==='concord'?'#6fa8ff':'#ff5a4e',t,2.4,7);
          if(foe==='player')AudioSys.sfx('enemyshot',Math.max(.15,1-d/2500));}
        if(t.hull<t.maxHull*.25&&t.role!=='sentinel'){goal=t.pos.clone().add(t.pos.clone().sub(fp).normalize().multiplyScalar(3000));spd*=1.3;}}
      else if(t.role==='trader'||t.role==='patrol'){if(!t.dest||t.pos.distanceTo(t.dest)<400||t.t<0){const b=U.pick(Math.random,S.bodies.filter(x=>x.site||x.dock));t.dest=b?b.pos.clone().add(new THREE.Vector3((Math.random()-.5)*b.r*3,(Math.random()-.5)*b.r,(Math.random()-.5)*b.r*3)):new THREE.Vector3((Math.random()-.5)*20000,0,(Math.random()-.5)*20000);t.t=120;}goal=t.dest;spd*=t.pos.distanceTo(t.dest)>4000?6:1;}
      else{goal=t.pos.clone().add(new THREE.Vector3(Math.sin(S.time*.2+t.radius)*300,0,Math.cos(S.time*.2)*300));spd*=.4;}
      if(goal){const want=goal.clone().sub(t.pos).normalize();const cur=new THREE.Vector3(0,0,1).applyQuaternion(t.quat);const axis=new THREE.Vector3().crossVectors(cur,want);const ang=Math.asin(U.clamp(axis.length(),-1,1))*(cur.dot(want)<0?-1:1);
        if(axis.lengthSq()>1e-6){axis.normalize();t.quat.premultiply(new THREE.Quaternion().setFromAxisAngle(axis,U.clamp(cur.dot(want)<0?Math.PI:ang,-t.turn*dt,t.turn*dt)));}
        const fwd=new THREE.Vector3(0,0,1).applyQuaternion(t.quat);t.vel.lerp(fwd.multiplyScalar(spd),1-Math.exp(-dt*1.5));}
      t.pos.addScaledVector(t.vel,dt);t.mesh.quaternion.copy(t.quat);
      for(const gl of t.mesh.userData.glows)gl.scale.setScalar(t.mesh.userData.length*(.2+U.clamp(t.vel.length()/t.speed,0,2)*.3));
      if(t.pos.distanceTo(P.pos)>40000&&!t.quest&&t.role!=='sentinel'){t.dead=true;S.scene.remove(t.mesh);}
    }
    S.ships=S.ships.filter(t=>!t.dead);
  },
  spawnEvents(dt){
    const S=this,s=G.state;S.spawnT-=dt;if(S.spawnT>0||S.warp)return;const sec=S.sys.security??.3;S.spawnT=45+sec*120+Math.random()*60;
    const ctl=Story.controlOf(s,S.sys);
    if(Math.random()<(1-sec)*.8&&S.ships.filter(t=>t.hostile).length<6){const n=1+Math.floor(Math.random()*(sec<.3?4:2));const at=S.P.pos.clone().add(new THREE.Vector3((Math.random()-.5)*5000,(Math.random()-.5)*1200,(Math.random()-.5)*5000));
      for(let i=0;i<n;i++)this.spawnNPCShip(ctl&&ctl.startsWith('civ:')&&Cosmos.civById(ctl.slice(4))?.attitude<-.4?ctl:'syndicate','raider',at.clone().add(new THREE.Vector3(i*120,0,i*80)));UI.toast(`${n} hostile contact${n>1?'s':''} dropping out of warp.`,'bad');AudioSys.sfx('alarm');}
    else if(S.ships.length<10)this.spawnNPCShip(ctl&&ctl!=='syndicate'?ctl:'frontier','trader');
  },

  /* ── Landing & docking ── */
  landable(nb){const S=this,P=S.P;let best=null;for(const b of S.bodies){if(!b.site&&!b.dock)continue;const d=P.pos.distanceTo(b.pos)-b.r;const lim=b.dock?Math.max(700,b.r*3):Math.max(500,b.r*1.6);if(d<lim&&(!best||d<best.d))best={b,d};}return best&&best.b;},
  tryLand(){const S=this;const b=this.landable();if(!b){UI.toast('Nothing to land on or dock with nearby. Get closer.');return;}if(S.P.vel.length()>900&&!S.cruise){UI.toast('Too fast to land. Slow down.');return;}
    S.cruise=0;if(b.dock)Game.dock(b.dock);else Game.land(b.site);},

  /* ── Warp sequence ── */
  startWarp(onArrive,gate){const S=this;S.warp={t:0,onArrive,gate,phase:'spool'};AudioSys.sfx('warp');UI.toast(gate?'Gate transit':'Warp field forming','lvl');},
  updateWarp(dt){
    const S=this,W=S.warp,P=S.P;W.t+=dt;const fwd=new THREE.Vector3(0,0,1).applyQuaternion(P.quat);

      Render.fx.warp=.9;S.shake=3;S.sky.visible=W.t<.3;if(W.t>3.2){Render.fx.fade=Math.min(1,(W.t-3.2)*3);}if(W.t>3.6){const cb=W.onArrive;S.warp=null;Render.fx.warp=0;cb();}}
    P.mesh.position.copy(P.pos);const L=P.mesh.userData.length;G.camera.position.copy(P.pos).add(new THREE.Vector3(0,L*.3,-L*1.4).applyQuaternion(P.quat)).add(new THREE.Vector3((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake,0));G.camera.lookAt(P.pos.clone().addScaledVector(fwd,L*5));

  /* ── HUD: brackets, target, speed ── */
  hud(){
    const S=this,s=G.state,P=S.P;const el=U.$('#brackets');if(!el)return;const cam=G.camera;const W=innerWidth,H=innerHeight;let h='';
    const proj=(p)=>{const v=p.clone().project(cam);const behind=v.z>1;return{x:(v.x*.5+.5)*W,y:(-v.y*.5+.5)*H,behind};};
    const tgtQ=Game.questSpaceTarget();

      h+=`<div class="bracket ${cls}" style="left:${q.x}px;top:${q.y}px"><div class="t">${U.esc(label)} · ${dist<1000?Math.round(dist)+' m':(dist/1000).toFixed(1)+' km'}</div></div>`;};
    for(const b of S.bodies){if(b.def.type==='gate'&&!b.active&&b.pos.distanceTo(P.pos)>30000)continue;const d=P.pos.distanceTo(b.pos)-b.r;const isQ=tgtQ&&(tgtQ===b.def.id||tgtQ===b.site||tgtQ===b.dock);drawB(b.pos,b.name+(b.site||b.dock?' ◆':''),'n'+(isQ?' q':''),Math.max(0,d)*50);}

const Game={
  newState(p){

    const s={v:1,player:{name:p.name,origin:p.origin,attrs,skills,hp:0,o2:0,focus:100,rad:0,weapon:'sidearm',mag:{sidearm:12},suit:p.suit,skin:p.skin,hair:p.hair},
      credits:3000,inv:{sidearm:1,slugs:60,medkit:2,o2:2},ship:{name:p.ship,hull:'kestrel',fit:{high:['pulse1','mine1'],mid:['shield1','scanner'],low:['armor1','reactor1'],drive:'torch'},hp:0,fuel:0,paint:'#9fb0c2'},
      hangar:[],ownedModules:{},crew:[],loyalty:{},flags:{},rep:{concord:0,frontier:0,oracle:0,syndicate:-10,thalassi:0,kepleri:0,engineers:0},quests:{},dyn:{},
      earthYear:START_YEAR,shipYears:0,loc:{system:'sol',site:'earth'},visited:{sol:1},news:[],world:{oracle:.25,frontier:.3,frontierRadius:14,pop:1,control:{}},stats:{kills:0,jumps:0,ly:0},wanted:0,dayPhase:.35,track:'mq'};

  },
  newGame(p){const s=this.newState(p);G.state=s;s.player.hp=this.maxHp();s.player.o2=this.maxO2();const st=this.shipStats();s.ship.hp=st.hull;s.ship.fuel=st.fuel;
    s.news.push({y:s.earthYear,t:'Solnet: The Far-Side Array\'s mysterious "Null Signal" enters its fourteenth month. ORACLE maintains it is instrument noise.'});
    Story.start(s,'mq');this.start(s,true);},
  start(s,fresh){
    G.state=s;this.migrate(s);UI.fade(true,'');
    const go=()=>{if(s.loc.station){this.goSpace(s.loc.system,{fromBody:s.loc.station});setTimeout(()=>{s.loc.station=s.loc.station;this.dock(s.loc.station,true);},50);}
      else if(s.loc.site&&!s.loc.inSpace)this.goSurface(s.loc.site,{system:s.loc.system});else this.goSpace(s.loc.system,{});

  migrate(s){s.dyn=s.dyn||{};s.hangar=s.hangar||[];s.world=s.world||{oracle:.25,frontier:.3,frontierRadius:14,pop:1,control:{}};s.world.control=s.world.control||{};s.stats=s.stats||{kills:0,jumps:0,ly:0};s.loyalty=s.loyalty||{};},
  loadSlot(slot){const s=Store.load(slot);if(!s){UI.toast('That save could not be read.','bad');UI.title();return;}this.start(s);},

  quitToTitle(){this.autosave();Surface.dispose();Space.dispose();G.mode='title';AudioSys.stopAmbient();AudioSys.stopRadio();Menu3D.start();UI.title();},

  /* ── Stats ── */
  maxHp(){const P=G.state.player;return Math.round(100+(P.attrs.END-5)*12+levelFor(P.skills.combat)*1.2+(P.origin==='marine'?25:0));},
  maxO2(){return 240+(G.state.player.attrs.END-5)*25;},

  capacity(){return this.personalCap()+this.shipStats().cargo;},
  load(){const s=G.state;let w=0;for(const k in s.inv){if(ITEMS[k])w+=ITEMS[k].w*s.inv[k];}return w;},
  crewCap(){return this.shipStats().crew;},
  shipStats(){
    const s=G.state;const H=HULLS[s.ship.hull];const f=s.ship.fit;const lv=k=>levelFor(s.player.skills[k]||1);
    const st={pg:H.pg*(s.crew.includes('mara')?1.15:1)*(1+lv('engineering')/200),cpu:H.cpu,pgUsed:0,cpuUsed:0,hull:H.hull,shield:0,regen:0,dps:0,mine:0,speed:H.speed,turn:H.turn,cargo:H.cargo,crew:H.crew,fuel:H.fuel,warp:.12,range:99999,fuelLy:2,boost:0,dmgBonus:0,scan:0};

  /* ── Interstellar travel and relativity ── */
  gateList(){const s=G.state;const out=[];for(const id in SYSTEMS){const S=SYSTEMS[id];if(!S.bodies)continue;const g=S.bodies.find(b=>b.type==='gate');if(g&&s.flags[g.flag])out.push(id);}
    if(s.flags.deepgates)for(const g in GALAXIES){if(g==='mw'||GALAXIES[g].gateSystem)continue;out.push('GATE.'+g);}return out;},
  planJump(target){
    const s=G.state;const st=this.shipStats();const here=s.loc.system;if(target===here)return{ok:false,why:'You are already here.'};
    const d=Cosmos.dist(here,target);if(!isFinite(d)){const gates=this.gateList();return{ok:false,why:gates.includes(target)?'Reach it through an Engineer gate: fly into an active gate ring.':'Another galaxy. Only an Engineer gate can take you there.'};}
    if(st.overload)return{ok:false,why:'Your fitting exceeds power grid or CPU. Fix it before engaging the drive.'};
    const fuel=d*st.fuelLy;if(st.warp>=1&&d>st.range)return{ok:false,why:`Out of range: ${U.ly(d)} away, your drive reaches ${U.ly(st.range)} per jump. Hop through nearer systems or upgrade the drive.`};
    if(fuel>s.ship.fuel)return{ok:false,why:`Not enough fuel: need ${Math.round(fuel)}, have ${Math.round(s.ship.fuel)}. Refuel at a station or scoop a gas giant.`};
    let years,shipYears,method,warn=null;
    if(st.warp<1){const v=st.warp;const gamma=1/Math.sqrt(1-v*v);const accelYears=1.1;years=d/v+accelYears;shipYears=years/gamma;method=`Fusion torch at ${(v*100).toFixed(0)}% c (γ = ${gamma.toFixed(4)}), crew in cryosleep`;warn=`This will take ${years.toFixed(1)} years of Earth time. Everyone you know will be ${years.toFixed(0)} years older.`;}
    else{years=d/st.warp;shipYears=years;method=st.warp>=1e5?'Engineer fold':`White–Juday warp at ${st.warp}c (no time dilation inside the bubble)`;}
    return{ok:true,d,fuel,years,shipYears,method,warn};
  },
  jump(target,viaGate){
    const s=G.state;if(G.mode!=='space'){UI.toast('Engage jumps from the helm in space.');return;}
    let plan=viaGate?{ok:true,years:0,shipYears:0,fuel:0,d:0,method:'gate'}:this.planJump(target);if(!plan.ok){UI.toast(plan.why,'bad');return;}
    Space.startWarp(()=>{
      s.ship.fuel-=plan.fuel;s.stats.jumps++;s.stats.ly+=plan.d;
      const piloting=levelFor(s.player.skills.piloting);this.addXP('piloting',Math.round(150+Math.min(plan.d,200)*25));
      this.advanceWorld(plan.years,plan.shipYears);
      this.goSpace(target,viaGate?{from:'gate'}:{});Render.fx.fade=0;
      const S=Cosmos.get(target);UI.titleCard(viaGate?'Gate transit':`${U.ly(plan.d)} · ${U.yrs(plan.years)} Earth time`,S.name,`${S.star?.cls||''} · ${GALAXIES[S.galaxy||'mw'].name} · Earth ${s.earthYear.toFixed(1)}`);
      if(plan.years>2){UI.toast(`You were gone ${plan.years.toFixed(1)} years. Solnet has ${Math.min(6,Math.round(plan.years*1.5))} new headlines.`,'lvl');}
      this.crewReact('arrive',S);
    },viaGate);
  },
  advanceWorld(years,shipYears){const s=G.state;s.earthYear+=years;s.shipYears+=shipYears??years;Story.sim(s,Math.max(years,.05));},

    }[id];if(!L2)return null;const list=L2[kind]||L2.idle;return U.pick(r,list);},
  crewTalk(id){

        ch('[Charisma 7] You\'re the reason this ship works. I mean that.',{req:{attr:['CHA',7]},hide:{flag:'praised_'+id},fx:{loyal:{[id]:8},flag:{['praised_'+id]:1}},go:'d'}),
        ch('Carry on.',{end:1})]),
      b:say(id,{wick:'Honestly? I haven\'t felt this alive since the crash. Don\'t tell my therapist.',noor:'Tired. Proud. Worried about what we\'re bringing home.',ilyas:'I\'m sleeping four hours a night and I\'ve never been happier. That\'s probably a symptom.',mara:'My hands hurt and my coil works. Good trade.',yara:'Steady. Ask me again after the next fight.',samira:'I\'m fine. I\'m the doctor; I\'m always fine. That\'s the joke.',ren:'Better than on a bar stool on Titan.',ada:'Homesick for noise. Ceres is never quiet.',seven:'Your ship hums in B-flat. I hum back. We are friends now.',nine:'Operational. ...And curious. That is new.',ihru:'Heavy in the body, light in the heart. Your gravity is a gift.'}[id],[ch('Good.',{go:'a'})]),
      c:say(id,this.crewOpinion(id),[ch('Understood.',{go:'a'})]),
      d:say(id,'...Thank you, Captain. That matters more than you think.',[ch('Back to work.',{end:1})]),
    }};
    UI.dialogue('crew_'+id,{name:c.name,role:c.role});
  },
  crewOpinion(id){const f=G.state.flags;const likes={
      ilyas:[f.keel==='oracle'?'Handing the Keel to ORACLE still keeps me up at night.':'Keeping the Keel out of ORACLE\'s hands was right.',f.quiet==='absorbed'?'We fed a dead civilization to our machine. I don\'t know how to forgive that.':f.quiet==='freed'?'Asking the Quiet what it wanted was the most human thing I\'ve seen anyone do.':''],
      ada:[f.he3==='seized'?'You stole heating fuel from my people. I\'m here to make sure you never do it again.':f.he3==='shared'?'You shared the drive. The League will name ships after you.':'',f.dust==='ordered'?'Mars will remember that order.':''],
      nine:[f.quiet==='destroyed'?'You destroyed knowledge ORACLE needed. I understand why. I am still processing it.':'ORACLE appreciates your trust. So do I.'],
      mara:[f.dust==='ordered'?'You ordered my people back into the domes. I\'m here for the coil, Captain, not for you.':'You did right by the Yards.'],
      noor:[f.keel==='concord'?'The Concord will make good use of the Keel. I hope.':'The Council is furious with us. That usually means we\'re doing something right.'],
      ren:[f.thalassi==='isolated'?'Leaving the Choir alone took discipline. History will thank you.':f.thalassi==='networked'?'Wiring the Thalassi to ORACLE... I hope we never learn what that cost.':'Every contact so far has held. That\'s rare.'],
    }[id];const l=(likes||[]).filter(Boolean);return l.length?l.join(' '):'I trust you. Mostly. Ask me again when something goes wrong.';},

  /* ── Quest markers for the compass and space HUD ── */
  compassMarkers(){
    const s=G.state;const S=Surface;const out=[];if(!S.player)return out;const pp=S.player.pos;
    const add=(x,z,k,t)=>{const a=Math.atan2(x-pp.x,z-pp.z);const d=Math.hypot(x-pp.x,z-pp.z);out.push({a:a+Math.PI,k,t,d:d>1000?(d/1000).toFixed(1)+'km':Math.round(d)+'m'});};
    for(const q of Story.active(s)){const st=Story.cur(s,q);if(!st||!st.target)continue;const tg=st.target;const main=q===s.track;
      if(tg.site===S.siteId||(S.interior&&tg.site===s.loc.site)){
        if(tg.npc){const a=S.actors.find(x=>x.o&&x.o.id===tg.npc);if(a)add(a.pos.x,a.pos.z,main?'':'n',NPCS[tg.npc].name);}
        else if(tg.poi&&S.pois[tg.poi])add(S.pois[tg.poi][0],S.pois[tg.poi][1],main?'':'n',Story.qdef(s,q).name);}
      else if(main&&!S.interior&&S.shipDoor)add(S.shipDoor.x,S.shipDoor.z,'n','Your ship');}
    for(const i of S.interact)add(i.pos.x,i.pos.z,'',i.label);
    for(const a of S.actors){if(a.kind==='enemy'&&!a.dead&&a.hostile&&a.pos.distanceTo(pp)<80)add(a.pos.x,a.pos.z,'e','');}
    return out;
  },
  questSpaceTarget(){const s=G.state;const st=s.track&&Story.cur(s,s.track);if(!st||!st.target)return null;const t=st.target;if(t.system&&t.system!==s.loc.system)return null;if(t.body)return t.body;if(t.site){const site=Cosmos.site(t.site);if(site&&site.system===s.loc.system)return t.site;}return null;},

  onQuestChanged(q,stage){
    const s=G.state;
    if(q==='mq'&&stage===225){this.advanceWorld(11,.005);s.flags.dilated=1;setTimeout(()=>{Cine.play('throat');UI.toast('Time dilation: 11 years have passed on Earth while you crossed the Throat.','lvl');},300);}
    if(q==='mq'&&stage===240){s.flags.gate_m31=1;s.flags.gate_lmc=1;UI.toast('The Throat Gate opens toward Andromeda and the Magellanic Clouds.','lvl');}
    if(q==='mq'&&stage===245)setTimeout(()=>Cine.play('anchorage'),300);
    if(q==='mq'&&stage===80)UI.toast('The White–Juday drive is fitted. Open the star map (M) in space and jump to Alpha Centauri.','lvl');
    if(G.mode==='surface'&&Surface.scene&&!Surface.interior)Surface.syncQuestObjects();
    if(G.mode==='space'&&Space.scene)Space.syncQuestShips();
  },
  ending(key){const s=G.state;s.flags.ended=key;s.flags.deepgates=1;Story.setStage(s,'mq',250);Story.sim(s,.2);setTimeout(()=>UI.ending(key),400);},
  npcHostile(){if(G.mode!=='surface')return;for(const a of Surface.actors){if(a.kind==='npc'&&a.o.alien==='thalassi'){a.flee=30;}}for(let i=0;i<5;i++){const a=Math.random()*6.28;Surface.spawnEnemy('stinger',Surface.player.pos.x+Math.cos(a)*30,Surface.player.pos.z+Math.sin(a)*30);}
    if(!G.state.inv.shard||G.state.inv.shard<3){Game.giveItem('shard',3-(G.state.inv.shard||0));G.state.quests.mq.stage=145;Story.setStage(G.state,'mq',150);G.state.flags.gate_tau=1;UI.toast('You tear the shards from the dying reef yourself. The Choir goes dark.','bad');}},
};

/* ── Cutscenes: letterboxed camera moves with subtitles ── */
const Cine={
  play(id,done){
    const shots=CUTS[id];if(!shots){done&&done();return;}G.cine={id,i:-1,t:0,shots,done};Input.unlock();this.next();
  },
  next(){const c=G.cine;if(!c)return;c.i++;c.t=0;if(c.i>=c.shots.length){this.end();return;}
    const [mode,dur,who,line]=c.shots[c.i];c.dur=dur;c.mode=mode;const name=who?(CREW[who]?CREW[who].name:NPCS[who]?NPCS[who].name:who):'';
    UI.letterbox(true,`${name?`<b style="color:var(--signal2);font:600 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px">${U.esc(name)}</b>`:''}${L(U.esc(line))}`,true);
    // camera setup
    const cam=G.camera;c.from=cam.position.clone();c.orbit=Math.random()*6.28;
    if(G.mode==='surface'&&Surface.scene){const S=Surface;let focus=S.player.pos.clone().add(new THREE.Vector3(0,1.6,0));
      if(mode.startsWith('poi:')){const p=S.pois[mode.slice(4)];if(p)focus=new THREE.Vector3(p[0],S.h(p[0],p[1])+3,p[1]);}
      if(mode==='sky'){focus=S.player.pos.clone().add(new THREE.Vector3(0,40,0));}
      if(mode==='yard'){const a=S.actors.find(x=>x.o&&x.o.id==='mara');focus=a?a.pos.clone().add(new THREE.Vector3(0,1.6,0)):focus;}
      c.focus=focus;}
    else if(G.mode==='space'&&Space.scene){c.focus=Space.P.pos.clone();const b=Space.bodies.find(x=>mode.includes(x.def.id));if(b)c.focus=b.pos.clone();c.space=true;c.rad=b?b.r*2.6:200;}
  },
  update(dt){const c=G.cine;if(!c)return;c.t+=dt;
    if(Input.hit('Space')||Input.hit('Escape')||Input.hit('Enter')||Input.tHit.has('Jump')){if(c.t>.3)this.next();return;}
    if(c.t>c.dur){this.next();return;}
    const cam=G.camera;const k=c.t/c.dur;
    if(c.focus){const a=c.orbit+k*.5;const R=c.space?c.rad:c.mode==='sky'?60:c.mode.startsWith('poi')?22:6;const h=c.space?R*.25:c.mode==='sky'?-30:c.mode.startsWith('poi')?9:1.2;
      cam.position.set(c.focus.x+Math.cos(a)*R,c.focus.y+h+(c.mode==='sky'?0:k*2),c.focus.z+Math.sin(a)*R);if(c.mode==='sky')cam.lookAt(c.focus.x+Math.cos(a+1)*400,c.focus.y+300,c.focus.z+Math.sin(a+1)*400);else cam.lookAt(c.focus);cam.up.set(0,1,0);}
  },
  end(){const c=G.cine;G.cine=null;UI.letterbox(false);if(G.mode==='space'&&Space.P){G.camera.up.set(0,1,0);}if(c&&c.done)c.done();}
};

/* ── Title-screen backdrop: a slow orbit of Earth ── */
const Menu3D={
  start(){const sc=new THREE.Scene();G.scene=sc;const sky=Gen.spaceSky({seed:4,band:1,nebula:'#3a4a8a',nebula2:'#8a3a5a'});sc.add(sky);
    const sun=Gen.star(500,'#fff4ea');sun.position.set(14000,5000,9000);sc.add(sun);const l=new THREE.PointLight(C('#fff4ea'),3,0,0);l.position.copy(sun.position);sc.add(l);sc.add(new THREE.AmbientLight(C('#1a2233'),.5));
    const earth=new THREE.Mesh(new THREE.SphereGeometry(900,128,64),Gen.planetMaterial({type:'earth',pal:['#2a5d9a','#3d7a3e'],atmo:'#7fb8ff'},3));sc.add(earth);const atm=Gen.atmosphere(900,'#7fb8ff');sc.add(atm);
    const moon=new THREE.Mesh(new THREE.SphereGeometry(240,64,32),Gen.planetMaterial({type:'rocky',pal:['#a9a6a0','#6f6c68']},9));moon.position.set(2600,300,-2400);sc.add(moon);
    const ship=Gen.ship('meridian',{high:['pulse2','pulse2','mine1'],drive:'warp2'},'#9fb0c2');ship.position.set(620,260,1400);ship.scale.setScalar(2.2);sc.add(ship);
    const sd=sun.position.clone().normalize();[earth,moon].forEach(m=>m.material.uniforms.sunDir.value.copy(sd));atm.material.uniforms.sunDir.value.copy(sd);
    this.s={sc,earth,ship,sky,sun,t:0};G.camera.near=1;G.camera.far=600000;G.camera.updateProjectionMatrix();G.mode='title';},
  update(dt){const m=this.s;if(!m)return;m.t+=dt;m.earth.rotation.y+=dt*.01;m.earth.material.uniforms.time.value=G.time;m.ship.position.x=620+Math.sin(m.t*.05)*80;m.ship.rotation.set(Math.sin(m.t*.3)*.05,-.6+m.t*.004,Math.sin(m.t*.2)*.08);
    const a=m.t*.012;G.camera.position.set(Math.cos(a)*1200+900,420+Math.sin(m.t*.05)*40,Math.sin(a)*400+2900);G.camera.lookAt(300,120,600);m.sky.position.copy(G.camera.position);if(m.sun.userData.mat)m.sun.userData.mat.uniforms.time.value=G.time;}
};

/* ── Boot & loop ── */
function boot(){
  const canvas=U.$('#gl');Render.init(canvas);Input.init(canvas);UI.init();
  G.camera=new THREE.PerspectiveCamera(G.settings.fov,innerWidth/innerHeight,.1,600000);
  Cosmos.init();
  Menu3D.start();UI.title();
  G.onUnlock=()=>{if((G.mode==='surface'||G.mode==='space')&&!Input.uiOpen&&!G.cine&&!UI.dlgEl&&!Input.touch&&!G._noPause){}};
  let last=performance.now();
  const loop=(now)=>{requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;
    const s=G.state;
    // Neural Targeting slows the world, not the player's input
    if(G.vats&&s){s.player.focus-=dt*18;if(s.player.focus<=0){s.player.focus=0;G.vats=false;}}else if(s&&s.player.focus<100)s.player.focus=Math.min(100,s.player.focus+dt*6);
    const ts=G.vats?.3:1;G.dt=dt*ts;G.time+=dt;
    Render.fx.vats=U.damp(Render.fx.vats,G.vats?1:0,8,dt);Render.fx.damage=U.damp(Render.fx.damage,0,2.5,dt);
    if(s&&G.mode==='surface'){s.player.hp=Math.min(s.player.hp,Game.maxHp());}
    handleGlobalKeys();
    if(G.mode==='title')Menu3D.update(dt);
    else if(G.mode==='surface'){Surface.update(G.dt);if(!G.paused&&s)s.earthYear+=dt/(365*24*60);}
    else if(G.mode==='space'){Space.update(G.dt);}
    if(G.cine)Cine.update(dt);
    if(G.scene)Render.draw(G.scene,G.camera);
    if(s&&G.mode!=='title')UI.hudTick();
    U.$('#vats').classList.toggle('on',!!G.vats);
    Input.endFrame();
  };
  requestAnimationFrame(loop);
  addEventListener('beforeunload',()=>{if(G.state&&G.mode!=='title')Store.save('auto',G.state);});
}
function handleGlobalKeys(){
  if(G.mode==='title')return;
  if(UI.dlgEl&&UI._dlgKeys){for(let i=1;i<=9;i++)if(Input.hit('Digit'+i)&&UI._dlgKeys[i-1])UI._dlgKeys[i-1]();return;}
  if(G.cine)return;
  if(Input.hit('Escape')){if(UI.open)UI.close();else UI.wrist('system');return;}
  if(UI.open){if(Input.hit('Tab')&&UI.open.el.id==='wrist')UI.close();if(Input.hit('KeyM')&&UI.open.el.id==='map')UI.close();return;}
  if(Input.hit('Tab')||Input.tHit.has('Menu'))UI.wrist('status');
  else if(Input.hit('KeyJ'))UI.wrist('quests');
  else if(Input.hit('KeyM')||Input.tHit.has('Map'))UI.starmap();
  else if(G.mode==='surface'&&Input.hit('KeyB')&&Surface.shipDoor&&!Surface.interior&&Surface.player.pos.distanceTo(Surface.shipDoor)<14)Game.boardShip();
  if(Input.tHit.has('KeyE')&&G.mode==='surface'){Input.hitSet.add('KeyE');}
}
addEventListener('DOMContentLoaded',()=>{try{boot();}catch(e){console.error(e);document.body.insertAdjacentHTML('beforeend',`<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070d;color:#ffcf7e;font:14px monospace;padding:20px;text-align:center">The game could not start: ${String(e.message||e)}<br>WebGL is required.</div>`);}});

</script>
